<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Minecraft 24/7 Bot</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e1e; color: #fff; text-align: center; padding-top: 50px; }
        .card { background: #2d2d2d; padding: 20px; border-radius: 10px; display: inline-block; width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input, select { width: 90%; padding: 10px; margin: 10px 0; background: #3c3c3c; border: 1px solid #555; color: #fff; border-radius: 5px; }
        button { width: 95%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        #startBtn { background: #28a745; color: white; }
        #startBtn:hover { background: #218838; }
        #stopBtn { background: #dc3545; color: white; }
        #stopBtn:hover { background: #c82333; }
        #console { background: #111; color: #00ff00; text-align: left; padding: 10px; height: 150px; overflow-y: scroll; font-family: monospace; font-size: 12px; border-radius: 5px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Minecraft 24/7 Bot</h2>
        
        <input type="text" id="ipInput" placeholder="IP сервера (напр: 127.0.0.1:25565)">
        <input type="text" id="nickInput" placeholder="Нік бота (необов'язково)">
        
        <select id="versionSelect">
            <option value="auto">Автовизначення версії</option>
            <option value="1.21.1">1.21.1</option>
            <option value="1.20.4">1.20.4</option>
            <option value="1.20.1">1.20.1</option>
            <option value="1.19.4">1.19.4</option>
            <option value="1.18.2">1.18.2</option>
            <option value="1.17.1">1.17.1</option>
            <option value="1.16.5">1.16.5</option>
        </select>

        <button id="startBtn" onclick="startBot()">Почати 24/7</button>
        <button id="stopBtn" onclick="stopBot()">Стоп</button>

        <div id="console">Консоль логів...</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function logMessage(msg) {
            const consoleDiv = document.getElementById('console');
            consoleDiv.innerHTML += `<div>> ${msg}</div>`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function startBot() {
            const host = document.getElementById('ipInput').value;
            const customNick = document.getElementById('nickInput').value;
            const version = document.getElementById('versionSelect').value;

            if (!host) {
                alert('Введіть IP сервера!');
                return;
            }

            socket.emit('start-bot', { host, customNick, version });
        }

        function stopBot() {
            socket.emit('stop-bot');
        }

        socket.on('log', (data) => {
            logMessage(data);
        });

        socket.on('status', (status) => {
            if (status === 'running') {
                document.getElementById('startBtn').style.opacity = '0.5';
            } else {
                document.getElementById('startBtn').style.opacity = '1';
            }
        });
    </script>
</body>
</html>
