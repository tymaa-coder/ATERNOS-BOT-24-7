<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Bot Control Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e1e; color: #fff; padding: 20px; max-width: 550px; margin: auto; }
        .card { background: #2d2d2d; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; background: #3d3d3d; border: 1px solid #555; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-start { background: #4CAF50; color: white; }
        .btn-equip { background: #ff9800; color: white; }
        .btn-attack { background: #e91e63; color: white; }
        .btn-stop { background: #f44336; color: white; }
        #logs { background: #111; padding: 10px; height: 140px; overflow-y: auto; font-family: monospace; font-size: 12px; border-radius: 4px; margin-top: 10px; border: 1px solid #444; }
    </style>
</head>
<body>

<div class="card">
    <h2>Налаштування ботів</h2>
    <label>IP сервера:</label>
    <input type="text" id="host" placeholder="наприклад: myServer.aternos.me">

    <label>Порт:</label>
    <input type="text" id="port" value="25565">

    <label>Базовий нік ботів:</label>
    <input type="text" id="baseUsername" value="BotArmy">

    <label>Кількість ботів:</label>
    <input type="number" id="count" value="1" min="1" max="10">

    <label>Версія гри:</label>
    <select id="version">
        <option value="auto">Автовизначення</option>
        <option value="1.21.4">1.21.4</option>
        <option value="1.20.4">1.20.4</option>
        <option value="1.19.4">1.19.4</option>
    </select>

    <button class="btn-start" onclick="startBots()">Запустити ботів</button>
</div>

<div class="card">
    <h2>Керування спорядженням та атакою</h2>
    
    <button class="btn-equip" onclick="equipGear()">Одягнути броню, взяти меч і тотем</button>

    <hr style="border-color: #444; margin: 15px 0;">

    <label>Нік цілі для нападу:</label>
    <input type="text" id="targetName" placeholder="Введіть нік гравця">
    <button class="btn-attack" onclick="attackPlayer()">Напасти на гравця</button>

    <button class="btn-stop" onclick="stopBots()">Зупинити всіх ботів</button>

    <h3>Логи:</h3>
    <div id="logs"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    function logMessage(msg) {
        const logs = document.getElementById('logs');
        logs.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        logs.scrollTop = logs.scrollHeight;
    }

    function startBots() {
        const host = document.getElementById('host').value;
        const port = document.getElementById('port').value;
        const baseUsername = document.getElementById('baseUsername').value;
        const count = document.getElementById('count').value;
        const version = document.getElementById('version').value;

        if (!host) {
            alert('Введіть IP сервера!');
            return;
        }

        socket.emit('start-bots', { host, port, baseUsername, count, version });
    }

    function equipGear() {
        socket.emit('equip-gear');
    }

    function attackPlayer() {
        const targetName = document.getElementById('targetName').value;
        socket.emit('attack-attack' || 'attack-player', { targetName }); // виправлено виклик
    }

    // Правильний виклик для атаки:
    function attackPlayer() {
        const targetName = document.getElementById('targetName').value;
        socket.emit('attack-player', { targetName });
    }

    function stopBots() {
        socket.emit('stop-bots');
    }

    socket.on('log', (data) => {
        logMessage(data);
    });
</script>

</body>
</html>
